<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
    
  <title>Wire-Pod 初始设置</title>
  <!-- Meta Apple tags for a PWA like experience. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body>
  <div id="outer">
    <div id="content" class="">
      <h1>Wire-Pod 设置</h1>
      <hr />
      <div id="setup-status"></div>
      <div id="config-options" style="display: block">
        <p>
          欢迎使用 Wire-Pod！请按需配置以下选项，然后点击底部的“提交设置”按钮完成设置。
        </p>
        <hr />
        <div id="section-conn" style="display: block">
          <h3>连接方式</h3>
          <hr class="small-hr">
          <div class="center" id="connStatus"></div>
          <select onchange="checkConn()" name="connSelection" id="connSelection">
            <option value="ep">
              Escape Pod（普通量产机器人推荐）
            </option>
            <option value="ip">
              IP 地址（OSKR/dev 解锁机器人推荐）
            </option>
          </select>
          <div class="center" id="portViz" style="display: none">
            <label for="portInput">输入自定义端口（默认为 443）</label>
            <input type="text" id="portInput" name="portInput" placeholder="443" />
          </div>
          <hr />
        </div>

        <div id="section-language" style="display: none">
          <h3>语音转文字语言</h3>
          <hr class="small-hr">
          <div class="center" id="languageStatus"></div>
          <div id="languageSelectionDiv">
            <select name="languageSelection" id="languageSelection">
              <option value="en-US">英语（美国）</option>
              <option value="it-IT">意大利语（意大利）</option>
              <option value="es-ES">西班牙语（西班牙）</option>
              <option value="fr-FR">法语（法国）</option>
              <option value="de-DE">德语（德国）</option>
              <option value="pt-BR">葡萄牙语（巴西）</option>
              <option value="pl-PL">波兰语（波兰）</option>
              <option value="tr-TR">土耳其语（土耳其）</option>
              <option value="ko-KR">韩语（韩国）</option>
              <option value="zh-CN">中文（中国）</option>
              <option value="ru-RU">俄语（俄罗斯）</option>
              <option value="nt-NL">荷兰语（荷兰）</option>
              <option value="uk-UA">乌克兰语（乌克兰）</option>
              <option value="vi-VN">越南语（越南）</option>
            </select>
          </div>
          <hr />
        </div>

        <small class="desc">完成 Wire-Pod 设置后，可以在“服务器设置”页面配置天气和知识库。</small>
        <hr />

        <button onclick="sendSetupInfo()">
          提交设置
        </button>
      </div>
    </div>
  </div>
</body>
<script src="./js/ui.js"></script>
<script src="./js/main.js"></script>
<script src="./js/initial.js"></script>
<!-- <script src="./sdkapp/js/main.js"></script> -->
<script>
  checkLanguage();
</script>

</html>
