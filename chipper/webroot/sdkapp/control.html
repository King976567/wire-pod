<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Vector Web 应用</title>
  <!-- Meta Apple tags for a PWA like experience. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body onload="updateControlButtons()">
  <div id="outer">
    <div id="content">
      <h1 class="center">Vector 控制（测试版）</h1>
      <hr />
      <div class="main-nav-parent">
        <div class="main-nav-child">
          <a href="#" onclick="goBackToSettings()"><i class="fa-solid fa-reply"></i><br />返回</a>
        </div>
      </div>
      <hr />

      <div id="sdkActions">
        <h2 class="center">摄像头画面</h2>
        <hr class="small-hr">
        <div class="center" id="camStream"></div>
        <div style="text-align: left;" class="center">
          <label>
            <input type="radio" name="cam" id="cam" onclick="showCamStream()">开始摄像头串流<br>
          </label>
          <label>
            <input type="radio" name="cam" id="cam" onclick="stopCamStream()" checked>停止摄像头串流<br>
          </label>
        </div>
        <hr />

        <h2 class="center">行为控制</h2>
        <hr class="small-hr">
        <small class="center">执行任何操作前，必须先取得行为控制权</small>
        <div style="text-align: left;" class="center">
          <label>
            <input type="radio" name="control" id="assume_control"
              onclick="sendForm('/api-sdk/assume_behavior_control?priority=high'); updateControlButtons();">取得控制权<br>
          </label>
          <label>
            <input type="radio" name="control" id="release_control"
              onclick="sendForm('/api-sdk/release_behavior_control'); updateControlButtons();" checked>释放控制权<br>
          </label>
        </div>
        <hr />

        <h2 class="center">电机控制</h2>
        <hr class="small-hr">
        <small class="center">启用键盘控制（不稳定）<br>WASD 控制轮子，R/F 控制升降，T/G 控制头部上下</small>
        <div style="text-align: left;" class="center">
          <label>
            <input type="radio" name="keycontrol" id="key_control_on" onclick="toggleKeyboard()" disabled>开启<br>
          </label>
          <label>
            <input type="radio" name="keycontrol" id="key_control_off" onclick="toggleKeyboard()" checked
              disabled>关闭<br>
          </label>
        </div>
        <hr />

        <h2 class="center">镜像模式</h2>
        <hr class="small-hr">
        <div style="text-align: left;" class="center">
          <label>
            <input type="radio" name="mirror" id="mirror_on" onclick="sendForm('/api-sdk/mirror_mode?enable=true')"
              disabled>开启<br>
          </label>
          <label>
            <input type="radio" name="mirror" id="mirror_off" onclick="sendForm('/api-sdk/mirror_mode?enable=false')"
              checked disabled>关闭<br>
          </label>
        </div>
        <hr />

        <h2 class="center">朗读文字</h2>
        <div class="center">
          <input class="tinput" name="textSay" id="textSay" type="text" placeholder="在此输入文字" disabled />
        </div>
        <button onclick="sayText()" type="submit">提交</button>
      <hr />
      <h2 class="center">播放音频</h2>
        <div class="center">
          <input type="file" id="fileInput" accept=".wav">
        </div>
        <button id="uploadButton" style="display: none;" type="submit">发送音频</button>
        <div div class="center">
          <audio id="audioOutput" controls></audio>
        </div>
      </div>
      <hr />
    </div>
    </div>
  </div>
  <hr>
  </div>
  </div>

  <script src="./js/httprequest.js"></script>
  <script src="./js/iro.min.js"></script>
  <script src="./js/control.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/play_audio.js"></script>

  <iframe name="hiddenFrame" width="0" height="0" border="0" style="display: none"></iframe>
</body>

</html>
